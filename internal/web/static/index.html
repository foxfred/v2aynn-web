<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>v2aynn-web</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#0d1117;color:#e6edf3;line-height:1.6}
.box{max-width:900px;margin:0 auto;padding:20px}
h1{font-size:1.4rem;color:#58a6ff;margin-bottom:12px}
h2{font-size:1.1rem;color:#8b949e;border-bottom:1px solid #21262d;padding-bottom:6px;margin:18px 0 10px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px;background:#161b22;border:1px solid #30363d;border-radius:8px;margin-bottom:14px}
.dot{width:12px;height:12px;border-radius:50%;background:#f85149;display:inline-block}
.dot.on{background:#3fb950}
.btn{padding:6px 16px;border:1px solid #30363d;border-radius:6px;background:#21262d;color:#e6edf3;cursor:pointer;font-size:13px}
.btn:hover{background:#30363d}
.btn.st{background:#238636;border-color:#2ea043}
.btn.sp{background:#b62324;border-color:#da3633}
.btn.ac{background:#1f6feb;border-color:#388bfd}
.nwrap{border:1px solid #30363d;border-radius:6px;overflow:hidden;margin-bottom:10px}
.nlh{display:flex;align-items:center;padding:5px 10px;background:#161b22;border-bottom:1px solid #30363d;font-size:10px;color:#8b949e;font-weight:600}
.nlh .c1{flex:1}.nlh .c2{width:70px;text-align:right}.nlh .c3{width:110px;text-align:right}
.nl{display:grid;gap:1px;max-height:560px;overflow-y:auto;overflow-x:auto;background:#0d1117}
.ni{display:flex;justify-content:space-between;align-items:center;padding:5px 10px;background:#161b22;border-bottom:1px solid #21262d;cursor:pointer;min-width:420px}
.ni:last-child{border-bottom:none}
.ni.ac{border-left:3px solid #58a6ff;background:#0d419d22}
.ni .c2{width:70px;text-align:right;font-size:10px}
.ni .c3{width:110px;text-align:right;white-space:nowrap}
.nn{font-weight:600;font-size:11px}
.nm{font-size:10px;color:#8b949e}
.tag{display:inline-block;padding:0 4px;border-radius:3px;font-size:9px;margin-left:4px;line-height:16px}
.tag.vmess{background:#1f6feb33;color:#58a6ff}
.tag.vless{background:#8957e533;color:#bc8cff}
.tag.trojan{background:#f8514933;color:#ff7b72}
.tag.ss{background:#d2992233;color:#e3b341}
.fr{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.fr input{flex:1;min-width:120px;padding:6px 10px;background:#0d1117;border:1px solid #30363d;border-radius:6px;color:#e6edf3;font-size:13px}
.fr input:focus{outline:none;border-color:#58a6ff}
.si{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:#161b22;border:1px solid #30363d;border-radius:6px;margin-bottom:5px}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.sg label{font-size:12px;color:#8b949e;display:block;margin-bottom:3px}
.sg input{width:100%;padding:6px 10px;background:#0d1117;border:1px solid #30363d;border-radius:6px;color:#e6edf3}
</style></head>
<body><div class="box">
<h1>v2aynn-web</h1>
<div class="bar"><span class="dot" id="dot"></span><span id="st" title="当前节点" style="flex:1;min-width:0;font-size:13px;color:#8b949e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">连接中...</span>
<button class="btn st" onclick="doStart()">启动</button>
<button class="btn sp" onclick="doStop()">停止</button>
<button class="btn" onclick="refresh()">刷新</button></div>

<h2>节点 <button class="btn" onclick="pingAll()" style="font-size:10px;padding:2px 8px;margin-left:6px">全部测速</button>
<select id="sortSel" onchange="setSort(this.value)" style="font-size:10px;padding:2px 4px;background:#0d1117;border:1px solid #30363d;border-radius:4px;color:#e6edf3"><option value="">默认顺序</option><option value="ping_asc">延迟低到高</option><option value="ping_desc">延迟高到低</option></select></h2>
<div class="nwrap"><div class="nlh"><div class="c1">节点名称 / 地址</div><div class="c2">延迟</div><div class="c3">操作</div></div><div class="nl" id="nl">加载中...</div></div>

<h2>订阅 <button class="btn" onclick="updateSub()" style="font-size:10px;padding:2px 8px;margin-left:6px">更新订阅</button></h2>
<div class="fr"><input id="n" placeholder="名称"><input id="u" placeholder="订阅URL"><button class="btn" onclick="addSub()">添加</button></div>
<div id="sl"></div>

<h2>设置</h2>
<div class="sg">
<div><label>SOCKS端口</label><input id="s1" type="number"></div>
<div><label>HTTP端口</label><input id="s2" type="number"></div>
<div><label>监听地址</label><input id="s3"></div>
<div><label>刷新间隔(秒)</label><input id="s4" type="number"></div>
<div><label>订阅代理</label><input id="s5" placeholder="留空=直连"></div>
<div><label>代理模式</label><select id="s6" style="width:100%;padding:6px;background:#0d1117;border:1px solid #30363d;border-radius:6px;color:#e6edf3"><option value="smart">智能分流(国内直连)</option><option value="global">全局代理</option></select></div>
</div><button class="btn" onclick="saveSet()">保存</button>
</div>
<script>
let active='';
async function api(m,p,b){const o={method:m,headers:{'Content-Type':'application/json'}};if(b)o.body=JSON.stringify(b);return(await fetch(p,o)).json()}
async function refresh(){fetch('/api/fetch',{method:'POST'});await Promise.all([loadNodes(),loadSubs()]);loadStatus()}
async function loadStatus(){try{const s=await api('GET','/api/status');document.getElementById('dot').className='dot'+(s.running?' on':'');document.getElementById('st').textContent=(s.running?'运行中':'已停止')+(s.activeName?' - '+s.activeName:'');active=s.activeNode}catch(e){document.getElementById('st').textContent='连接失败'}}
async function loadNodes(){const d=await api('GET','/api/nodes');const el=document.getElementById('nl');const ss=document.getElementById('sortSel');if(ss&&d.sort)ss.value=d.sort;if(!d.nodes||!d.nodes.length){el.innerHTML='<div style="padding:12px;font-size:12px;color:#8b949e">暂无节点</div>';return}el.innerHTML=d.nodes.map(n=>{const pc=n.ping>0?'#8b949e':(n.ping<0?'#f85149':'#8b949e');const p=n.ping>0?n.ping+'ms':(n.ping<0?'超时':'');return'<div class="ni '+(n.id===d.active?'ac':'')+'" onclick="switchN(\''+n.id+'\')"><div style="flex:1;min-width:0"><div class="nn">'+esc(n.name)+'</div><div class="nm">'+n.server+':'+n.port+' <span class="tag '+n.protocol+'">'+n.protocol+'</span></div></div><div class="c2"><span class="ping" id="p'+n.id+'" style="font-size:10px;color:'+pc+'">'+p+'</span></div><div class="c3"><button class="btn" style="font-size:10px;padding:2px 6px" onclick="event.stopPropagation();pingNode(\''+n.id+'\')">测速</button><button class="btn '+(n.id===d.active?'ac':'')+'" style="font-size:10px;padding:2px 6px;margin-left:3px">'+(n.id===d.active?'当前':'切换')+'</button></div></div>'}).join('')}
async function setSort(v){await api('POST','/api/sort',{order:v});loadNodes()}
async function loadSubs(){const subs=await api('GET','/api/subs');document.getElementById('sl').innerHTML=(subs||[]).map(s=>'<div class="si"><span>'+esc(s.name)+' <span style="font-size:10px;color:#8b949e">'+esc(s.url)+'</span></span><button class="btn sp" onclick="delSub(\''+s.id+'\')">删除</button></div>').join('')}
async function addSub(){const nm=document.getElementById('n').value.trim(),url=document.getElementById('u').value.trim();if(!url)return;await api('POST','/api/subs',{name:nm,url:url});document.getElementById('n').value='';document.getElementById('u').value='';await loadSubs();await updateSub()}
async function updateSub(){const btn=[...document.querySelectorAll('button')].find(b=>b.textContent==='更新订阅');const el=document.getElementById('nl');if(btn){btn.disabled=true;btn.textContent='更新中...'}if(el)el.innerHTML='<div style="padding:12px;font-size:12px;color:#8b949e">正在更新订阅...</div>';await fetch('/api/fetch',{method:'POST'});await loadSubs();await loadNodes();if(btn){btn.disabled=false;btn.textContent='更新订阅'}}
async function delSub(id){await api('POST','/api/subs/'+id);await loadSubs();await loadNodes()}
async function switchN(id){await api('POST','/api/node/'+id);loadNodes();loadStatus()}
async function doStart(){await api('POST','/api/proxy/start');loadStatus()}
async function doStop(){await api('POST','/api/proxy/stop');loadStatus()}
async function loadSet(){const s=await api('GET','/api/settings');document.getElementById('s1').value=s.socksPort;document.getElementById('s2').value=s.httpPort;document.getElementById('s3').value=s.listenAddr;document.getElementById('s4').value=s.subRefresh;if(document.getElementById('s5'))document.getElementById('s5').value=s.subProxy||'';if(document.getElementById('s6'))document.getElementById('s6').value=s.proxyMode||'smart'}
async function saveSet(){await api('POST','/api/settings',{socksPort:parseInt(document.getElementById('s1').value),httpPort:parseInt(document.getElementById('s2').value),listenAddr:document.getElementById('s3').value,subRefresh:parseInt(document.getElementById('s4').value),subProxy:document.getElementById('s5')?document.getElementById('s5').value:'',proxyMode:document.getElementById('s6')?document.getElementById('s6').value:'smart'})}
async function setPing(el,r){if(!el)return;if(!r||r.ms===undefined){el.style.color='#8b949e';el.textContent='';return}if(r.ms>0){el.style.color='#8b949e';el.textContent=r.ms+'ms'}else if(r.ms<0){el.style.color='#f85149';el.textContent='超时'}else{el.style.color='#8b949e';el.textContent=''}}
async function pingNode(id){const el=document.getElementById('p'+id);if(el)el.textContent='测速中...';try{const r=await api('POST','/api/ping/'+id);setPing(el,r)}catch(e){setPing(el,{ms:-1})}}
async function pingAll(){const d=await api('GET','/api/nodes');if(!d.nodes||!d.nodes.length)return;const ids=d.nodes.map(n=>n.id).sort(()=>Math.random()-0.5);const btn=document.querySelector('[onclick="pingAll()"]');if(btn){btn.disabled=true;btn.textContent='测速中 0/'+ids.length}document.querySelectorAll('.ping').forEach(el=>el.textContent='测速中...');let done=0;for(let i=0;i<ids.length;i+=5){const batch=ids.slice(i,i+5);await Promise.all(batch.map(async id=>{try{const r=await api('POST','/api/ping/'+id);setPing(document.getElementById('p'+id),r)}catch(e){setPing(document.getElementById('p'+id),{ms:-1})}}));done+=batch.length;if(btn)btn.textContent='测速中 '+done+'/'+ids.length;await new Promise(r=>setTimeout(r,0))}if(btn){btn.disabled=false;btn.textContent='全部测速'}loadNodes()}
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
refresh();loadSet();setInterval(loadStatus,5000);
</script></body></html>
