<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>v2aynn-web</title>
<script>
/* 主题初始化：必须放在样式表之前执行。若放在样式表之后，浏览器会先用浅色渲染一帧
   再被深色覆盖，出现肉眼可见的闪白。
   默认浅色（主主题）。只认用户手动选过的值，不跟随系统偏好——
   否则用户在系统里切到深色，会把自己设好的浅色又冲掉。 */
(function(){try{if(localStorage.getItem('v2aynn-theme')==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}})();
</script>
<style>
/* ========== 主题变量 ==========
   浅色是默认（:root），深色靠 html[data-theme="dark"] 覆盖。
   两套主题的「明暗关系」是相反的，不能互相照搬：
   深色靠「越亮越靠前」建立层次（底 #0d1117 → 面板 #161b22 → 按钮 #21262d）；
   浅色靠「边框 + 阴影 + 底色差」建立层次，因为浅色之间色差天然很小。
   刻意不声明 color-scheme：原版就没有声明，浏览器按原生浅色渲染那些没写样式的
   控件（侧栏的「+」按钮、原生下拉框、复选框、滚动条）。一旦写上 color-scheme:dark，
   侧栏「+」会从白底黑字变成深底浅字，与原版不一致。浅色主题下原生控件本来就是
   浅色，所以不声明两边都对。
   另注意：实心按钮的底色深色与浅色不是同一组值（浅色下要更深才够对比度），
   文字色也分开给 —— 原版实心按钮是继承 #e6edf3，不是纯白。 */
:root{
  --bg-body:#E9EDF2;      /* 页面底：比容器深一档，容器才「浮」得起来 */
  --bg-app:#FFFFFF;       /* 应用容器、侧栏、节点区 */
  --bg-surface:#F6F8FA;   /* 顶栏、表头、弹窗面板 */
  --bg-hover:#F6F8FA;     /* 行悬停 */
  --bg-chip:#EAEEF2;      /* 数量角标 */
  --bg-input:#FFFFFF;
  --btn-bg:#F6F8FA;       /* 默认按钮：落在白色区域上 */
  --btn-bg-band:#FFFFFF;  /* 默认按钮：落在浅灰顶栏上，白底才看得出是按钮 */
  --btn-bg-hover:#EAEEF2;
  --border:#D0D7DE;
  --border-subtle:#E4E8ED;
  --text:#1F2328;
  --text-muted:#59636E;
  --on-solid:#FFFFFF;     /* 实心按钮上的文字 */
  --accent:#0969DA;       /* 用作文字/描边 */
  --accent-soft:#0969DA1F;
  --solid-accent:#0969DA;
  --solid-accent-border:#0969DA;
  --solid-green:#1A7F37;
  --solid-green-border:#1A7F37;
  --solid-red:#CF222E;
  --solid-red-border:#CF222E;
  --success:#1A7F37;
  --warning:#9A6700;
  --danger:#CF222E;
  --tag-vmess-bg:#0969DA1F;  --tag-vmess-fg:#0969DA;
  --tag-vless-bg:#8250DF1F;  --tag-vless-fg:#8250DF;
  --tag-trojan-bg:#CF222E1F; --tag-trojan-fg:#CF222E;
  --tag-ss-bg:#9A67001F;     --tag-ss-fg:#9A6700;
  --overlay:rgba(16,22,34,.45);
  --app-shadow:0 0 20px rgba(16,22,34,.12);
}
:root[data-theme="dark"]{
  --bg-body:#0d1117;
  --bg-app:#0d1117;
  --bg-surface:#161b22;
  --bg-hover:#161b22;
  --bg-chip:#21262d;
  --bg-input:#0d1117;
  --btn-bg:#21262d;
  --btn-bg-band:#21262d;
  --btn-bg-hover:#30363d;
  --border:#30363d;
  --border-subtle:#21262d;
  --text:#e6edf3;
  --text-muted:#8b949e;
  --on-solid:#e6edf3;     /* 原版实心按钮继承的就是这个值，不是纯白 */
  --accent:#58a6ff;
  --accent-soft:#0d419d22;
  --solid-accent:#1f6feb;
  --solid-accent-border:#388bfd;
  --solid-green:#238636;
  --solid-green-border:#2ea043;
  --solid-red:#b62324;
  --solid-red-border:#da3633;
  --success:#3fb950;
  --warning:#e3b341;
  --danger:#f85149;
  --tag-vmess-bg:#1f6feb33;  --tag-vmess-fg:#58a6ff;
  --tag-vless-bg:#8957e533;  --tag-vless-fg:#bc8cff;
  --tag-trojan-bg:#f8514933; --tag-trojan-fg:#ff7b72;
  --tag-ss-bg:#d2992233;     --tag-ss-fg:#e3b341;
  --overlay:rgba(0,0,0,.5);
  --app-shadow:0 0 20px rgba(0,0,0,.3);
}

*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:var(--bg-body);color:var(--text);line-height:1.6;height:100vh;overflow:hidden;font-size:14px}
.app{display:flex;flex-direction:column;height:100vh;max-width:1100px;margin:0 auto;background:var(--bg-app);border-left:1px solid var(--border);border-right:1px solid var(--border);box-shadow:var(--app-shadow)}

/* 顶栏 */
.topbar{display:flex;align-items:center;gap:10px;padding:8px 16px;background:var(--bg-surface);border-bottom:1px solid var(--border);flex-shrink:0}
.topbar .dot{width:11px;height:11px;border-radius:50%;background:var(--danger);display:inline-block;flex-shrink:0}
.topbar .dot.on{background:var(--success)}
.topbar .st{flex:1;min-width:0;font-size:13px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .btn{padding:5px 14px;border:1px solid var(--border);border-radius:5px;background:var(--btn-bg-band);color:var(--text);cursor:pointer;font-size:13px;flex-shrink:0}
.topbar .btn:hover{background:var(--btn-bg-hover)}
.topbar .btn.st{background:var(--solid-green);border-color:var(--solid-green-border);color:var(--on-solid)}
.topbar .btn.sp{background:var(--solid-red);border-color:var(--solid-red-border);color:var(--on-solid)}
.topbar .btn.ac{background:var(--solid-accent);border-color:var(--solid-accent-border);color:var(--on-solid)}
.topbar .spd{font-size:13px;color:var(--text-muted);flex-shrink:0}

/* 主体：左右双栏 */
.main{display:flex;flex:1;overflow:hidden}

/* 左侧分组列表 */
.sidebar{width:220px;min-width:180px;border-right:1px solid var(--border);display:flex;flex-direction:column;background:var(--bg-app);flex-shrink:0}
.sidebar .sh{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-bottom:1px solid var(--border-subtle);font-size:13px;color:var(--text-muted);font-weight:600}
.sidebar .sh .btn{padding:3px 8px;font-size:12px;border:1px solid var(--border);border-radius:4px;background:var(--btn-bg);color:var(--text);cursor:pointer}
.sidebar .sh .btn:hover{background:var(--btn-bg-hover)}
.sidebar .gl{flex:1;overflow-y:auto}
.sidebar .gi{display:flex;align-items:center;padding:9px 10px;cursor:pointer;border-bottom:1px solid var(--border-subtle);transition:background .1s}
.sidebar .gi:hover{background:var(--bg-hover)}
.sidebar .gi.ac{border-left:3px solid var(--accent);background:var(--accent-soft)}
.sidebar .gi .gn{flex:1;min-width:0}
.sidebar .gi .gnm{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar .gi .gns{font-size:11px;color:var(--text-muted)}
.sidebar .gi .gcnt{font-size:11px;color:var(--text-muted);padding:1px 6px;background:var(--bg-chip);border-radius:8px}
.sidebar .gi .gact{font-size:11px;padding:2px 6px;background:var(--solid-accent);color:#fff;border-radius:3px;margin-left:4px}

/* 右侧节点区域 */
.content{flex:1;display:flex;flex-direction:column;overflow:hidden}
.content .ch{display:flex;align-items:center;gap:6px;padding:6px 12px;border-bottom:1px solid var(--border-subtle);flex-shrink:0;flex-wrap:wrap}
.content .ch .cht{font-size:15px;font-weight:600;color:var(--text)}
.content .ch .btn{padding:3px 10px;border:1px solid var(--border);border-radius:4px;background:var(--btn-bg);color:var(--text);cursor:pointer;font-size:12px}
.content .ch .btn:hover{background:var(--btn-bg-hover)}
.content .ch .btn.st{background:var(--solid-green);border-color:var(--solid-green-border);color:var(--on-solid)}
.content .ch .btn.ac{background:var(--solid-accent);border-color:var(--solid-accent-border);color:var(--on-solid)}
.content .ch .btn.sp{background:var(--solid-red);border-color:var(--solid-red-border);color:var(--on-solid)}
.content .ch select{font-size:12px;padding:3px 5px;background:var(--bg-input);border:1px solid var(--border);border-radius:3px;color:var(--text)}

/* 节点列表 */
.nwrap{flex:1;overflow-y:auto;overflow-x:auto}
.nlh{display:flex;align-items:center;padding:6px 10px;background:var(--bg-surface);border-bottom:1px solid var(--border);font-size:12px;color:var(--text-muted);font-weight:600;position:sticky;top:0;z-index:1}
.nlh .c1{flex:1;min-width:100px;max-width:480px}
.nlh .c2{width:52px;text-align:right;flex-shrink:0}.nlh .c3{width:118px;text-align:right;flex-shrink:0}
.ni{display:flex;align-items:center;padding:7px 10px;border-bottom:1px solid var(--border-subtle);cursor:pointer;min-width:360px;transition:background .1s}
.ni:hover{background:var(--bg-hover)}
.ni.ac{border-left:3px solid var(--accent);background:var(--accent-soft)}
.ni .nn{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ni .nm{font-size:11px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ni .c1{flex:1;min-width:100px;max-width:480px;overflow:hidden}
.ni .c2{width:52px;text-align:right;font-size:12px;flex-shrink:0}
.ni .c3{width:118px;text-align:right;white-space:nowrap;flex-shrink:0}
.ni .c3 .btn{padding:3px 7px;font-size:11px;border:1px solid var(--border);border-radius:3px;background:var(--btn-bg);color:var(--text);cursor:pointer}
.ni .c3 .btn:hover{background:var(--btn-bg-hover)}
.ni .c3 .btn.ac{background:var(--solid-accent);border-color:var(--solid-accent-border);color:var(--on-solid)}
.tag{display:inline-block;padding:0 4px;border-radius:2px;font-size:10px;margin-left:3px;line-height:16px}
.tag.vmess{background:var(--tag-vmess-bg);color:var(--tag-vmess-fg)}
.tag.vless{background:var(--tag-vless-bg);color:var(--tag-vless-fg)}
.tag.trojan{background:var(--tag-trojan-bg);color:var(--tag-trojan-fg)}
.tag.ss{background:var(--tag-ss-bg);color:var(--tag-ss-fg)}

/* 弹窗/表单 */
.modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:var(--overlay);z-index:100;align-items:center;justify-content:center}
.modal.show{display:flex}
.modal .mp{background:var(--bg-surface);border:1px solid var(--border);border-radius:8px;padding:18px;width:460px;max-width:92vw;max-height:82vh;overflow-y:auto}
.modal .mp h3{font-size:15px;color:var(--accent);margin-bottom:12px}
.modal .mp label{font-size:12px;color:var(--text-muted);display:block;margin-bottom:3px}
.modal .mp input,.modal .mp select,.modal .mp textarea{width:100%;padding:6px 9px;margin-bottom:9px;background:var(--bg-input);border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:13px}
.modal .mp textarea{min-height:80px;resize:vertical}
.modal .mp .sg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.modal .mp .btn{padding:6px 16px;border:1px solid var(--border);border-radius:4px;background:var(--btn-bg);color:var(--text);cursor:pointer;font-size:13px;margin-right:8px}
.modal .mp .btn.st{background:var(--solid-green);border-color:var(--solid-green-border);color:var(--on-solid)}
.modal .mp .btn.sp{background:var(--solid-red);border-color:var(--solid-red-border);color:var(--on-solid)}
.empty{color:var(--text-muted);font-size:13px;padding:20px;text-align:center}
/* 设置面板 */
.st-ft{font-size:12px;color:var(--text-muted);margin-bottom:8px;padding-top:6px;border-top:1px solid var(--border-subtle)}
.st-full{grid-column:1/-1}
.modal .mp label.ck{display:flex;align-items:center;gap:6px;cursor:pointer;margin:4px 0 10px}
.modal .mp label.ck input{width:auto;margin:0}
</style></head>
<body><div class="app">
<div class="topbar">
<span class="dot" id="dot"></span>
<span class="st" id="st">连接中...</span>
<button class="btn st" onclick="doStart()">启动</button>
<button class="btn sp" onclick="doStop()">停止</button>
<button class="btn" onclick="refreshAll()">更新全部</button>
<button class="btn ac" onclick="speedTest()">真实测速</button>
<span class="spd" id="spd">速度 --</span>
<button class="btn" onclick="showSettings()">设置 ⚙</button>
<button class="btn" id="themeBtn" onclick="toggleTheme()" title="切换浅色 / 深色主题">☾ 深色</button>
</div>

<div class="main">
<!-- 左侧分组列表 -->
<div class="sidebar">
<div class="sh">
<span>订阅分组</span>
<button onclick="showAddGroup()">+</button>
</div>
<div class="gl" id="gl"></div>
</div>

<!-- 右侧节点列表 -->
<div class="content">
<div class="ch" id="ch">
<span class="cht" id="grpName">全部节点</span>
<button class="btn ac" onclick="toggleAddNode()">+ 手动</button>
<button class="btn st" onclick="toggleImport()">+ 粘贴</button>
<button class="btn" onclick="pingGroup()">测速</button>

<select id="sortSel" onchange="setSort(this.value)">

<div class="nl" id="nl"><div class="empty">选择左侧分组查看节点</div></div>
</div>
</div>
</div>
</div>

<!-- 添加分组弹窗 -->
<div class="modal" id="addGroupModal">
<div class="mp">

<label>名称</label><input id="gn" placeholder="例: 我的节点">

<!-- 设置弹窗 -->

<!-- 编辑分组弹窗 -->
<div class="modal" id="editGroupModal">
<div class="mp">
<h3>编辑订阅分组</h3>
<label>名称</label><input id="egn">
<label>订阅URL</label><input id="egu">
<label>订阅代理（可选）</label><input id="egp" placeholder="http://127.0.0.1:7890">
<div class="st-ft">保存后将清空该分组现有节点，并立即用新订阅链接重新拉取。</div>
<div><button class="btn st" onclick="updateGroup()">保存</button><button class="btn" onclick="closeModal('editGroupModal')">取消</button></div>
</div>
</div>

<script>
let active='', curGrp='', groups=[];

async function api(m,p,b){const o={method:m,headers:{'Content-Type':'application/json'}};if(b)o.body=JSON.stringify(b);return(await fetch(p,o)).json()}

function closeModal(id){document.getElementById(id).classList.remove('show')}

/* 主题切换。按钮上显示的是「点了会切到哪个主题」，不是当前主题，
   否则用户看到「浅色」会以为已经处于浅色，点了没反应反而像坏了。 */
function setTheme(t,save){
  document.documentElement.setAttribute('data-theme',t);
  if(save){try{localStorage.setItem('v2aynn-theme',t)}catch(e){}}
  const b=document.getElementById('themeBtn');
  if(b)b.textContent=(t==='dark'?'☀ 浅色':'☾ 深色');
}
function toggleTheme(){setTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark',true)}

// 加载分组列表
async function loadGroups(){
  const d=await api('GET','/api/groups');
  groups=d.groups||[];
  const el=document.getElementById('gl');
  el.innerHTML=groups.map(g=>{
    const isActive=g.id===curGrp;
    const isDefault=g.id==='__default__';
    const editBtn=(!isDefault&&g.url)?'<span class="gact" onclick="event.stopPropagation();editGroup(\''+g.id+'\')">编辑</span>':'';
    return '<div class="gi'+(isActive?' ac':'')+'" onclick="selectGroup(\''+g.id+'\')"><div class="gn"><div class="gnm">'+esc(g.name)+'</div><div class="gns">'+(g.url?esc(g.url).substring(0,30)+'...':'无订阅')+'</div></div><span class="gcnt">'+g.nodeCount+'</span>'+editBtn+'</div>'
  }).join('');
  if(!curGrp&&groups.length>0)selectGroup(groups[0].id);
}

// 选择分组
async function selectGroup(id){
  curGrp=id;
  loadGroups();
  const d=await api('GET','/api/group/'+id+'/nodes');
  const nodes=d.nodes||[];
  active=d.active||'';
  const el=document.getElementById('nl');
  const grp=groups.find(g=>g.id===id);
  document.getElementById('grpName').textContent=grp?grp.name:'节点';
  document.getElementById('delGrpBtn').style.display=(grp&&grp.url)?'inline-block':'none';
  if(!nodes.length){el.innerHTML='<div class="empty">暂无节点</div>';return}
  el.innerHTML=nodes.map(n=>{
    const pc=n.ping<0?'var(--danger)':'var(--text-muted)';
    const p=n.ping>0?n.ping+'ms':(n.ping<0?'超时':'');
    return '<div class="ni '+(n.id===active?'ac':'')+'" onclick="switchN(\''+n.id+'\')"><div class="c1"><div class="nn">'+esc(n.name)+'</div><div class="nm">'+n.server+':'+n.port+' <span class="tag '+n.protocol+'">'+n.protocol+'</span></div></div><div class="c2"><span class="ping" id="p'+n.id+'" style="font-size:10px;color:'+pc+'">'+p+'</span>'+(n.speed>0?'<div style="font-size:9px;color:var(--success)">'+n.speed.toFixed(1)+'M</div>':'')+'</div><div class="c3"><button class="btn" onclick="event.stopPropagation();pingNode(\''+n.id+'\')">测速</button><button class="btn" style="margin-left:3px;color:var(--danger)" onclick="event.stopPropagation();delNode(\''+n.id+'\')">删除</button></div></div>'
  }).join('');
}

// 设置面板
async function showSettings(){
  try{
    const s=await api('GET','/api/settings');
    document.getElementById('setSocks').value=s.socksPort||'';
    document.getElementById('setHttp').value=s.httpPort||'';
    document.getElementById('setListen').value=s.listenAddr||'';
    // 注意：subRefresh 的 0 是合法值（禁用自动刷新），不能用 `||''` 兜底，
    // 否则 0 会显示成空白，用户会误以为没设置成功。
    document.getElementById('setRefresh').value=(s.subRefresh===0||s.subRefresh)?String(s.subRefresh):'';
    document.getElementById('setMode').value=s.proxyMode||'smart';
    document.getElementById('setSubProxy').value=s.subProxy||'';
    document.getElementById('setSpeedURL').value=s.speedURL||'';
    document.getElementById('setFailover').checked=(s.autoFailover!==false);
  }catch(e){}
  document.getElementById('settingsModal').classList.add('show');
}

async function saveSettings(){
  const socks=parseInt(document.getElementById('setSocks').value);
  const http=parseInt(document.getElementById('setHttp').value);
  // 单独取原始文本：空串要判为"未填"，而 0 是合法值，两者不能混为一谈
  const rawRefresh=document.getElementById('setRefresh').value.trim();
  const refresh=rawRefresh===''?NaN:parseInt(rawRefresh,10);
  if(!socks||socks<=0||socks>65535){alert('SOCKS5端口无效');return}
  if(!http||http<=0||http>65535){alert('HTTP端口无效');return}
  // 0 = 禁用自动刷新（合法）；其余需在 10-86400 秒之间。
  // 原先的 `!refresh||refresh<10` 会把 0 一并拦下，导致"禁用"这个功能在界面上根本无法设置。
  if(isNaN(refresh)){alert('订阅刷新间隔请填写数字（0 = 禁用自动刷新）');return}
  if(refresh!==0&&(refresh<10||refresh>86400)){alert('订阅刷新间隔需为 0（禁用自动刷新）或 10-86400 秒');return}
  const b={
    socksPort:socks,
    httpPort:http,
    listenAddr:document.getElementById('setListen').value.trim()||'0.0.0.0',
    subRefresh:refresh,
    proxyMode:document.getElementById('setMode').value,
    subProxy:document.getElementById('setSubProxy').value.trim(),
    speedURL:document.getElementById('setSpeedURL').value.trim()||'https://speed.cloudflare.com/__down?bytes=2000000',
    autoFailover:document.getElementById('setFailover').checked
  };
  const r=await api('POST','/api/settings',b);
  closeModal('settingsModal');
  if(r.error){alert('保存失败: '+r.error);return}
  alert('设置已保存，代理配置已应用');
}

// 配置备份 / 恢复
function backupCfg(){location.href='/api/backup'}

function restoreCfg(el){
  const f=el.files[0];
  el.value='';
  if(!f)return;
  if(!confirm('导入将覆盖当前全部分组与节点，确定继续？'))return;
  const rd=new FileReader();
  rd.onload=async()=>{
    try{
      const res=await fetch('/api/restore',{method:'POST',headers:{'Content-Type':'application/json'},body:rd.result});
      const r=await res.json();
      if(r.error){alert('恢复失败: '+r.error);return}
      closeModal('settingsModal');
      alert('配置已恢复（'+r.groups+' 个分组），列表即将刷新');
      curGrp='';
      await loadGroups();
      loadStatus();
    }catch(e){alert('恢复失败: 文件内容不是合法 JSON')}
  };
  rd.readAsText(f);
}
